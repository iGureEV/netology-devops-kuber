apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange
  namespace: netology
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange
  template:
    metadata:
      labels:
        app: data-exchange
    spec:
      containers:
        - name: busybox
          image: busybox
          command: ["/bin/sh", "-c"]
          args:
            - "while true; do echo \"$(date) Hello from busybox\" >> /data/index.html; sleep 5; done"
          volumeMounts:
            - name: shared-data
              mountPath: /data
        - name: multitool
          image: wbitt/network-multitool
          command: ["/bin/sh", "-c"]
          args:
            - "tail -f /data/index.html"
          volumeMounts:
            - name: shared-data
              mountPath: /data
      volumes:
        - name: shared-data
          emptyDir: {}
