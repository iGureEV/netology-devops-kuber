apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: netology
  labels:
    app: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
        - name: multitool
          image: wbitt/network-multitool
          envFrom:
            - configMapRef:
                name: multitool-config
          ports:
            - containerPort: 8080
      volumes:
        - name: web-content
          configMap:
            name: web-content
